<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Totalizador</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div id="Contenedor">
    <header><h1>Totalizador</h1></header>
    <form id="PrecioNeto-form">
      <section id="Productos">
      <label for="Producto-numero">Ingrese el precio del producto:</label>
      <input type="number" id="Producto-numero" min="0.01" step="0.01"/>
      </section>
      <section id="Cantidad">
      <label for="Cantidad-numero">Ingrese la cantidad del producto:</label>
      <input type="number" id="Cantidad-numero"  min="1" step="1"/>
      </section>

    <section id="Estado">
      <label for="Estado-codigo">Seleccione el estado:</label>
       <select id="Estado-codigo">
        <option value="CA" selected>CA</option>
        <option value="UT">UT</option>
        <option value="NV">NV</option>
        <option value="TX">TX</option>
        <option value="AL">AL</option>
      </select>
    </section>

    <section id="Botones">
      <button type="button" id="Cancelar-button">Cancelar compra</button>
      <button type="button" id="Confirmar-button">Confirmar compra</button>
    </section>
    
    </form>

    <section id="Resultados">
       <section>
    <label for="PrecioNeto-div">Precio Neto:</label>
    <input type="text" id="PrecioNeto-div" readonly />
    </section>

      <section>
        <label for="Descuento-div">Descuento:</label>
        <input type="text" id="Descuento-div" readonly />
      </section>

      <section>
        <label for="Impuesto-div">Impuesto:</label>
        <input type="text" id="Impuesto-div" readonly>
      </section>

      <section>
        <label for="PrecioTotal-div">Precio Total:</label>
        <input type="text" id="PrecioTotal-div" readonly>
      </section>

    </section>

    <p id="Error"></p>
    <p id="Mensaje-confirmacion"></p>

    <script type="module" src="./src/Totapresenter.js"></script>
    </div>

</body>
</html>
